<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Tetris — Tile Colors</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; padding: 24px; }
  h1 { margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; }
  th, td { border: 1px solid #333; padding: 8px 12px; text-align: left; }
  th { background: #1a1d24; }
  .swatch { width: 48px; height: 24px; border: 1px solid #555; display: inline-block; vertical-align: middle; }
  .hex { font-family: monospace; }
  tr:hover { background: #1a1d24; }
</style>
</head>
<body>
<h1>Local Tetris — Tile Colors (sorted by unlock level)</h1>
<table>
  <thead>
    <tr><th>ID</th><th>Name</th><th>Unlock Level</th><th>Color</th><th>Swatch</th></tr>
  </thead>
  <tbody>
    <tr><td>I</td><td>I</td><td>1</td><td class="hex">#00f0f0</td><td><span class="swatch" style="background:#00f0f0"></span></td></tr>
    <tr><td>O</td><td>O</td><td>1</td><td class="hex">#f0f000</td><td><span class="swatch" style="background:#f0f000"></span></td></tr>
    <tr><td>T</td><td>T</td><td>1</td><td class="hex">#a000f0</td><td><span class="swatch" style="background:#a000f0"></span></td></tr>
    <tr><td>S</td><td>S</td><td>1</td><td class="hex">#00f000</td><td><span class="swatch" style="background:#00f000"></span></td></tr>
    <tr><td>Z</td><td>Z</td><td>1</td><td class="hex">#f00000</td><td><span class="swatch" style="background:#f00000"></span></td></tr>
    <tr><td>J</td><td>J</td><td>1</td><td class="hex">#0000f0</td><td><span class="swatch" style="background:#0000f0"></span></td></tr>
    <tr><td>L</td><td>L</td><td>1</td><td class="hex">#f0a000</td><td><span class="swatch" style="background:#f0a000"></span></td></tr>
    <tr><td>P4</td><td>Pento-P</td><td>3</td><td class="hex">#3b95c0</td><td><span class="swatch" style="background:#3b95c0"></span></td></tr>
    <tr><td>I3</td><td>Tromino-I</td><td>4</td><td class="hex">#ff1493</td><td><span class="swatch" style="background:#ff1493"></span></td></tr>
    <tr><td>P2</td><td>Pento-U</td><td>5</td><td class="hex">#ff6e40</td><td><span class="swatch" style="background:#ff6e40"></span></td></tr>
    <tr><td>L3</td><td>Tromino-L</td><td>6</td><td class="hex">#00ff7f</td><td><span class="swatch" style="background:#00ff7f"></span></td></tr>
    <tr><td>P3</td><td>Pento-F</td><td>7</td><td class="hex">#00bfa5</td><td><span class="swatch" style="background:#00bfa5"></span></td></tr>
    <tr><td>P1</td><td>Pento-X</td><td>9</td><td class="hex">#ff4da6</td><td><span class="swatch" style="background:#ff4da6"></span></td></tr>
    <tr><td>P5</td><td>Pento-W</td><td>11</td><td class="hex">#9370db</td><td><span class="swatch" style="background:#9370db"></span></td></tr>
  </tbody>
</table>
</body>
</html>
