const tbody = document.getElementById("rows");
let current = null;
sounds.forEach((s, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${i+1}</td><td>${s.name}</td><td>${s.file}</td><td><button data-idx="${i}">Play</button></td>`;
  tbody.appendChild(tr);
});
tbody.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const idx = +btn.dataset.idx;
  const s = sounds[idx];
  if (current) { current.pause(); current = null; document.querySelectorAll("button").forEach(b => b.classList.remove("playing")); }
  const audio = new Audio(s.src);
  audio.addEventListener("ended", () => btn.classList.remove("playing"));
  audio.play().then(() => { btn.classList.add("playing"); current = audio; }).catch(err => alert("Could not play: " + err));
});
</script>
